name: SKapsule
options:
  bundleIdPrefix: com.skonstruct.dev
settings:
  DEVELOPMENT_TEAM: 87DLA8MPF5
targets:
  SKapsule:
    type: application
    platform: iOS
    deploymentTarget: '14.0'
    sources:
      - path: Natives
        excludes:
          - 'build'
          - 'build_xcode'
          - 'CMakeLists.txt'
          - 'awt_xawt'
          - 'Info.plist'
      - path: external/fishhook
    settings:
      CODE_SIGN_IDENTITY: 'Apple Development'
      ENABLE_USER_SCRIPT_SANDBOXING: NO
      INFOPLIST_FILE: 'Natives/Info.plist'
      OTHER_CFLAGS: '-DGLES_SILENCE_DEPRECATION=1'
    postBuildScripts:
      - name: Stage JRE and Assets
        basedOnDependencyAnalysis: false
        script: |
          make xcode-payload WORKINGDIR="${BUILT_PRODUCTS_DIR}"
    dependencies:
      - target: awt_headless
        link: false
        embed: false
      - target: awt_xawt
        link: false
        embed: false
      - target: awt
        link: false
        embed: false

  awt_headless:
    type: library.dynamic
    platform: iOS
    deploymentTarget: '14.0'
    sources:
      - path: Natives/awt_xawt/empty.m
    settings:
      CODE_SIGN_IDENTITY: 'Apple Development'

  awt_xawt:
    type: library.dynamic
    platform: iOS
    deploymentTarget: '14.0'
    sources:
      - path: Natives/awt_xawt/xawt_fake.m
    settings:
      CODE_SIGN_IDENTITY: 'Apple Development'

  awt:
    type: library.dynamic
    platform: iOS
    deploymentTarget: '14.0'
    sources:
      - path: Natives/awt_xawt/empty.m
    settings:
      CODE_SIGN_IDENTITY: 'Apple Development'
