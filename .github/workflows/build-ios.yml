name: Build for iOS

# Builds the IPAs. Manual only (Actions -> Build for iOS -> Run workflow): nothing builds on a
# push or a pull request. Called with a version by release-ios.yml, which makes it also publish a
# GitHub Release: that is the only way a release happens, so the tag is created after a
# successful build and a failed build leaves nothing behind to clean up.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version to release, without the leading v. Empty builds only.
        type: string
        default: ''

# A newer manual build replaces an older one still running (macOS minutes are the dear ones); a
# release is never cancelled.
concurrency:
  group: build-ios-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: ${{ inputs.version == '' }}

permissions:
  contents: write # creates the release and its tag

jobs:
  build:
    runs-on: macos-latest
    env:
      VERSION: ${{ inputs.version }}

    steps:
      # Everything a release needs is checked before the long build: a bad version, a missing
      # changelog section or an already-used tag fail in seconds.
      - name: Check release preconditions
        if: env.VERSION != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "Version must look like 1.2.3, without a leading v."
          [ "$GITHUB_REF" = refs/heads/main ] || fail "Releases are made from main."
          latest=$(gh release list -R "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // ""')
          [ -z "$latest" ] || [ "$(printf '%s\n%s\n' "${latest#v}" "$VERSION" | sort -V | tail -1)" = "$VERSION" ] \
            || fail "Version $VERSION must be newer than the latest release ($latest)."
          ! gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || fail "Release v$VERSION already exists."
          ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" >/dev/null 2>&1 \
            || fail "Tag v$VERSION already exists without a release. Delete it (git push origin :refs/tags/v$VERSION) or pick a new version."

      # LFS objects are fetched below, from a cache when the JRE zip has not changed.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          lfs: false

      # The Makefile versions the app from `git describe`, which needs the tags; the shallow
      # checkout has none on branch builds, so they reported 1.0.0.
      - name: Fetch tags for versioning
        run: git fetch --force --tags --unshallow origin || git fetch --force --tags origin

      - name: List LFS objects
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .git/lfs-ids

      - name: Cache LFS objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.git/lfs-ids') }}

      - name: Fetch LFS objects
        run: git lfs pull

      # The release notes are this version's CHANGELOG.md section, followed by GitHub's
      # generated notes.
      - name: Extract changelog section
        if: env.VERSION != ''
        run: |
          awk -v h="## $VERSION" '$0==h{f=1;next} /^## /{f=0} f' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md" || { echo "::error::CHANGELOG.md has no '## $VERSION' section"; exit 1; }

      # Java 8 is for LWJGL's multi-release layer, 25 (the default) for the build tools.
      - name: Setup Java 8 and 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: |
            8
            25

      # The Test workflow already runs these on every push; a release runs them again on the
      # commit it ships.
      - name: Run unit tests
        if: env.VERSION != ''
        run: make test

      # Each native component is cached on its own submodule commit and script, so changing one
      # does not rebuild the others. frenchpress and the bootstrap are rebuilt every time: they
      # are seconds, and the bootstrap also reads assets/shadow, which no submodule commit covers.
      - name: Submodule commits
        id: shas
        run: |
          {
            echo "gl4es=$(git rev-parse HEAD:external/gl4es)"
            echo "openal=$(git rev-parse HEAD:external/openal-soft)"
            echo "lwjgl3=$(git rev-parse HEAD:external/lwjgl3)"
            echo "cacio=$(git rev-parse HEAD:external/caciocavallo17)"
            echo "stikjit=$(git rev-parse HEAD:external/StikJIT)"
          } >> "$GITHUB_OUTPUT"

      - name: Cache gl4es
        id: cache-gl4es
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/gl4es
          key: native-gl4es-${{ runner.arch }}-${{ steps.shas.outputs.gl4es }}-${{ hashFiles('scripts/build-gl4es-ios.sh') }}

      - name: Cache openal-soft
        id: cache-openal
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/openal
          key: native-openal-${{ runner.arch }}-${{ steps.shas.outputs.openal }}-${{ hashFiles('scripts/build-openal-ios.sh') }}

      - name: Cache lwjgl3
        id: cache-lwjgl3
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/lwjgl3
          key: native-lwjgl3-${{ runner.arch }}-${{ steps.shas.outputs.lwjgl3 }}-${{ hashFiles('scripts/build-lwjgl3-ios.sh') }}

      - name: Cache cacio
        id: cache-cacio
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/cacio
          key: native-cacio-${{ steps.shas.outputs.cacio }}-${{ hashFiles('scripts/build-cacio-ios.sh') }}

      - name: Cache StikJIT
        id: cache-stikjit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/stikjit
          key: native-stikjit-${{ runner.arch }}-${{ steps.shas.outputs.stikjit }}-${{ hashFiles('scripts/build-stikjit-ios.sh', 'scripts/patches/**') }}

      - name: Cache rppairing
        id: cache-rppairing
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/rppairing
          key: native-rppairing-${{ runner.arch }}-${{ hashFiles('Natives/RPPairing/**', 'scripts/build-rppairing-ios.sh') }}

      # maven builds frenchpress, ldid signs and xcodegen is used by the app build, every run; the
      # rest is for the native components.
      - name: Install build dependencies
        run: brew install maven ldid xcodegen

      - name: Install native build dependencies
        if: >-
          steps.cache-gl4es.outputs.cache-hit != 'true' || steps.cache-openal.outputs.cache-hit != 'true' ||
          steps.cache-lwjgl3.outputs.cache-hit != 'true' || steps.cache-cacio.outputs.cache-hit != 'true'
        run: brew install ant ninja wget

      - name: Build gl4es
        if: steps.cache-gl4es.outputs.cache-hit != 'true'
        run: ./scripts/build-gl4es-ios.sh

      - name: Build openal-soft
        if: steps.cache-openal.outputs.cache-hit != 'true'
        run: ./scripts/build-openal-ios.sh

      - name: Build lwjgl3
        if: steps.cache-lwjgl3.outputs.cache-hit != 'true'
        env:
          JAVA8_HOME: ${{ env.JAVA_HOME_8_AARCH64 }}
          JAVA_HOME: ${{ env.JAVA_HOME_25_AARCH64 }}
        run: ./scripts/build-lwjgl3-ios.sh

      - name: Build cacio
        if: steps.cache-cacio.outputs.cache-hit != 'true'
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_25_AARCH64 }}
        run: ./scripts/build-cacio-ios.sh

      - name: Build StikJIT
        if: steps.cache-stikjit.outputs.cache-hit != 'true'
        run: ./scripts/build-stikjit-ios.sh

      - name: Build rppairing
        if: steps.cache-rppairing.outputs.cache-hit != 'true'
        run: ./scripts/build-rppairing-ios.sh

      - name: Build frenchpress and the bootstrap
        env:
          JAVA8_HOME: ${{ env.JAVA_HOME_8_AARCH64 }}
          JAVA_HOME: ${{ env.JAVA_HOME_25_AARCH64 }}
        run: |
          ./scripts/build-frenchpress-ios.sh
          ./scripts/build-bootstrap.sh

      # The JRE zip is an LFS object, fetched above. If it is still a pointer file, fail rather
      # than download an unchecked copy from somewhere else.
      - name: Ensure JRE zip is present
        run: |
          zip=assets/jre25-ios-aarch64.zip
          [ -f "$zip" ] && [ "$(wc -c < "$zip")" -ge 1000 ] || { echo "::error::$zip is missing or still an LFS pointer"; exit 1; }
          unzip -tq "$zip"

      - name: Stage app assets
        run: ./scripts/stage-app-assets.sh

      - name: Build Standard IPA
        run: |
          make package RELEASE=1 SK_BUILD=${{ github.run_number }} ${VERSION:+SK_VERSION=$VERSION}
          mv out/artifacts/com.skonstruct.skapsule-*.ipa out/artifacts/SKapsule.ipa

      # The same app with the TrollStore JIT entitlements: `make payload` differs only in the
      # entitlements ldid puts on the main binary, so the built Payload is re-signed and zipped
      # again instead of compiling the whole app a second time.
      - name: Build TrollStore IPA (JIT Entitlements)
        run: |
          ldid -S"$PWD/entitlements.trollstore.xml" out/artifacts/Payload/SKapsule.app/SKapsule
          chmod -R 755 out/artifacts/Payload
          (cd out/artifacts && zip -qr SKapsule-TrollStore.tipa Payload)

      # A staging step that silently skipped something would otherwise ship an app that cannot
      # launch; fail the build instead.
      - name: Verify the IPAs carry the runtime and natives
        run: |
          for ipa in out/artifacts/SKapsule.ipa out/artifacts/SKapsule-TrollStore.tipa; do
            listing=$(unzip -Z1 "$ipa")
            for need in \
              'Payload/SKapsule.app/jre25/lib/libjli.dylib' \
              'Payload/SKapsule.app/jre25/lib/modules' \
              'Payload/SKapsule.app/Frameworks/libgl4es.dylib' \
              'Payload/SKapsule.app/Frameworks/libopenal.dylib' \
              'Payload/SKapsule.app/libs/' \
              'Payload/SKapsule.app/libs_lwjgl/lwjgl.jar' \
              'Payload/SKapsule.app/Frameworks/liblwjgl.dylib' \
              'Payload/SKapsule.app/PlugIns/SKJITHelper.appex/SKJITHelper' \
              'Payload/SKapsule.app/legal/LICENSES-rppairing-crates.txt'; do
              grep -qF "$need" <<<"$listing" || { echo "::error::$ipa is missing $need"; exit 1; }
            done
          done

      # The two IPAs must differ only in the main binary's entitlements: the TrollStore one has to
      # carry them, and the standard one must not.
      - name: Verify the entitlements
        run: |
          std=$(mktemp -d); troll=$(mktemp -d)
          unzip -q out/artifacts/SKapsule.ipa 'Payload/SKapsule.app/SKapsule' -d "$std"
          unzip -q out/artifacts/SKapsule-TrollStore.tipa 'Payload/SKapsule.app/SKapsule' -d "$troll"
          ldid -e "$std/Payload/SKapsule.app/SKapsule" > "$std/ent.xml"
          ldid -e "$troll/Payload/SKapsule.app/SKapsule" > "$troll/ent.xml"
          ! cmp -s "$std/ent.xml" "$troll/ent.xml" || { echo "::error::the TrollStore IPA has the standard entitlements"; exit 1; }

      - name: Verify the IPA carries the release version
        if: env.VERSION != ''
        run: |
          got=$(unzip -p out/artifacts/SKapsule.ipa 'Payload/*.app/Info.plist' | plutil -extract CFBundleShortVersionString raw -)
          [ "$got" = "$VERSION" ] || { echo "::error::IPA reports version '$got', expected '$VERSION'"; exit 1; }

      # Creates the tag at the built commit together with the release, so a tag exists only
      # for a release that was actually published.
      - name: Publish GitHub Release
        if: env.VERSION != ''
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: |
            out/artifacts/SKapsule.ipa
            out/artifacts/SKapsule-TrollStore.tipa
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Upload Standard IPA
        if: env.VERSION == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SKapsule-iOS
          path: out/artifacts/SKapsule.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload TrollStore TIPA
        if: env.VERSION == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SKapsule-iOS-TrollStore
          path: out/artifacts/SKapsule-TrollStore.tipa
          if-no-files-found: error
          retention-days: 7
