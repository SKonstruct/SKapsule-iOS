name: Build iOS

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 8 (for LWJGL multi-release layer)
        uses: actions/setup-java@v4
        with: 
          distribution: temurin
          java-version: '8'

      - name: Setup Java 25 (for build tools)
        uses: actions/setup-java@v4
        with: 
          distribution: zulu
          java-version: '25'

      - name: Install build dependencies
        run: brew install ant maven ninja wget

      - name: Cache native build outputs
        id: cache-out
        uses: actions/cache@v4
        with:
          path: out
          key: native-macos14-${{ hashFiles('external/**') }}-${{ hashFiles('scripts/build-*.sh') }}

      - name: Build native submodules
        if: steps.cache-out.outputs.cache-hit != 'true'
        env:
          JAVA8_HOME: ${{ env.JAVA_HOME_8_X64 }}
          JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}
        run: |
          ./scripts/build-gl4es-ios.sh
          ./scripts/build-openal-ios.sh
          ./scripts/build-lwjgl3-ios.sh
          ./scripts/build-cacio-ios.sh
          ./scripts/build-frenchpress-ios.sh

      - name: Stage app assets
        run: ./scripts/stage-app-assets.sh

      - name: Build Standard IPA
        run: make package RELEASE=1

      - name: Build TrollStore IPA (JIT Entitlements)
        run: |
          make clean
          make package TROLLSTORE_JIT_ENT=1 RELEASE=1

      - name: Rename TrollStore TIPA
        run: mv artifacts/SKapsule.ipa artifacts/SKapsule-TrollStore.tipa

      - name: Upload Standard IPA
        uses: actions/upload-artifact@v4
        with:
          name: SKapsule-iOS
          path: artifacts/SKapsule.ipa
          if-no-files-found: error

      - name: Upload TrollStore TIPA
        uses: actions/upload-artifact@v4
        with:
          name: SKapsule-iOS-TrollStore
          path: artifacts/SKapsule-TrollStore.tipa
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/SKapsule.ipa
            artifacts/SKapsule-TrollStore.tipa
          generate_release_notes: true
          fail_on_unmatched_files: true
