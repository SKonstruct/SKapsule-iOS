name: Release iOS

# Manual: Actions -> Release iOS -> Run workflow. Builds both IPAs from main and, only if that
# succeeds, creates the tag and the GitHub Release (notes from CHANGELOG.md). Nothing is
# created on failure, so just run it again; there is no version to burn.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. X.Y.Z (CHANGELOG.md needs a '## X.Y.Z' section)"
        required: true
        type: string

concurrency: release

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/build-ios.yml
    with:
      version: ${{ inputs.version }}
    permissions:
      contents: write
