version: 2
updates:
  # Workflow actions are pinned to commit SHAs; Dependabot bumps the SHA and its "# vN" comment.
  # The rest of the build (XcodeGen project, native scripts, submodules) has no ecosystem
  # Dependabot reads.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
