name: Bug report
description: Something in SKapsule behaves incorrectly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Almost every "the game is unplayably slow" report is the app running without
        JIT.** Please confirm the JIT pill was green before you tapped Launch, and check
        [Troubleshooting](https://github.com/SKonstruct/SKapsule-iOS#troubleshooting)
        first.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before filing
      options:
        - label: I searched existing issues, including closed ones.
          required: true
        - label: I read the Troubleshooting section.
          required: true
        - label: This is a problem with SKapsule, not with Spiral Knights itself.
          required: true

  - type: input
    id: version
    attributes:
      label: SKapsule version and commit
      description: Shown in the log's `[Pre-Init]` lines, and in the launcher.
      placeholder: "X.Y.Z (abc1234)"
    validations:
      required: true

  - type: input
    id: ios
    attributes:
      label: iOS / iPadOS version
      description: Settings → General → About → Software Version.
      placeholder: "iOS 26.0"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      placeholder: "iPhone 15 Pro"
    validations:
      required: true

  - type: dropdown
    id: sideload
    attributes:
      label: How is the app installed?
      description: >
        This matters: the app needs the `get-task-allow` entitlement, and only some
        methods grant it.
      options:
        - AltStore
        - SideStore
        - TrollStore
        - Xcode
        - A signing service (Signulous, ESign, etc.)
        - Other (explain below)
    validations:
      required: true

  - type: dropdown
    id: jit
    attributes:
      label: JIT state when the problem happened
      options:
        - "The JIT pill was green before I tapped Launch"
        - "The pill never turned green"
        - "I launched without enabling JIT"
        - "Not relevant — the problem is before launching the game"
    validations:
      required: true

  - type: dropdown
    id: jit_method
    attributes:
      label: JIT method
      options:
        - Built-in (pairing file + LocalDevVPN)
        - StikDebug app
        - TrollStore
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: What area does this affect?
      description: A rough guess is fine.
      options:
        - Launcher / home screen
        - Enabling JIT
        - Login (Steam or web)
        - Downloading or patching the game
        - Gameplay, rendering or performance
        - On-screen touch controls
        - Hardware keyboard, mouse or controller
        - Mods
        - Audio
        - Installing or re-signing the IPA
        - Something else
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If it only happens sometimes, say how often and what seems to bring it on.
      placeholder: |
        1. Enable JIT, pill turns green
        2. Tap Launch
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Sidebar → **Share Logs**, then attach the files: `latestlog.txt`, any
        `hs_err_pid*.log` from a crash, and the `vmlog-*.log` / `vmout-*.log` files. A crash
        without a log is usually not actionable. Logs are not scrubbed and may contain your
        Steam account name, so skim them before posting.
      render: text
    validations:
      required: true

  - type: input
    id: sentry
    attributes:
      label: Sentry event ID
      description: Optional. If the app reported the crash, paste the ID it showed.

  - type: textarea
    id: mods
    attributes:
      label: Mods installed
      description: Optional. List them, or say "none". Mods replace game files and cause a fair share of visual bugs.
